<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="web_blank" name="shell-type" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-fixed": "#6ffbbe",
              error: "#ffb4ab",
              "inverse-surface": "#dfe2eb",
              "on-surface": "#dfe2eb",
              "on-secondary": "#003824",
              "surface-container-highest": "#31353c",
              "tertiary-container": "#ffddb8",
              "surface-bright": "#353940",
              "inverse-on-surface": "#2d3137",
              "on-primary": "#283500",
              "on-tertiary": "#472a00",
              "on-secondary-fixed-variant": "#005236",
              primary: "#ffffff",
              "secondary-fixed-dim": "#4edea3",
              "primary-fixed": "#c3f400",
              "surface-container-high": "#262a31",
              "on-primary-fixed-variant": "#3c4d00",
              "surface-container": "#1c2026",
              "surface-container-lowest": "#0a0e14",
              "on-tertiary-container": "#8d5900",
              "error-container": "#93000a",
              "inverse-primary": "#506600",
              "primary-container": "#c3f400",
              "outline-variant": "#444933",
              "surface-variant": "#31353c",
              "on-primary-container": "#556d00",
              "on-error-container": "#ffdad6",
              outline: "#8e9379",
              "tertiary-fixed": "#ffddb8",
              surface: "#10141a",
              "secondary-container": "#00a572",
              "surface-tint": "#abd600",
              "on-background": "#dfe2eb",
              "on-error": "#690005",
              "on-secondary-fixed": "#002113",
              background: "#10141a",
              "on-surface-variant": "#c4c9ac",
              "surface-dim": "#10141a",
              "on-secondary-container": "#00311f",
              secondary: "#4edea3",
              "surface-container-low": "#181c22",
              "tertiary-fixed-dim": "#ffb95f",
              tertiary: "#ffffff",
              "on-tertiary-fixed": "#2a1700",
              "on-tertiary-fixed-variant": "#653e00",
              "on-primary-fixed": "#161e00",
              "primary-fixed-dim": "#abd600",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "space-lg": "1.25rem",
              "space-sm": "0.5rem",
              "space-md": "0.75rem",
              gutter: "1rem",
              "space-xs": "0.25rem",
              margin: "1rem",
              "space-xl": "2rem",
            },
            fontFamily: {
              "headline-lg-mobile": ["Space Grotesk"],
              "headline-lg": ["Space Grotesk"],
              "headline-sm": ["Space Grotesk"],
              "label-sm": ["Space Grotesk"],
              "data-display": ["Space Grotesk"],
              "body-sm": ["Plus Jakarta Sans"],
              "headline-xl": ["Space Grotesk"],
              "label-lg": ["Space Grotesk"],
              "body-lg": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-xl-mobile": ["Space Grotesk"],
              "label-md": ["Space Grotesk"],
              "headline-md": ["Space Grotesk"],
            },
            fontSize: {
              "headline-lg-mobile": [
                "22px",
                { lineHeight: "28px", fontWeight: "700" },
              ],
              "headline-lg": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "headline-sm": [
                "16px",
                { lineHeight: "22px", fontWeight: "600" },
              ],
              "label-sm": ["10px", { lineHeight: "12px", fontWeight: "700" }],
              "data-display": [
                "32px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "headline-xl": [
                "36px",
                { lineHeight: "44px", fontWeight: "700" },
              ],
              "label-lg": ["14px", { lineHeight: "18px", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-xl-mobile": [
                "28px",
                { lineHeight: "34px", fontWeight: "700" },
              ],
              "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "headline-md": [
                "20px",
                { lineHeight: "26px", fontWeight: "600" },
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-surface font-body-md text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container"
  >
    <main
      class="w-full min-h-screen bg-surface flex flex-col justify-center items-center px-gutter py-space-xl"
    >
      <div
        class="flex flex-col w-full items-center justify-center py-space-xl px-gutter relative"
      >
        <div
          class="absolute w-[480px] h-[480px] bg-primary-fixed/5 rounded-full blur-3xl pointer-events-none -top-24 select-none"
        ></div>
        <div
          class="w-full max-w-[480px] relative z-10 flex flex-col gap-space-md"
        >
          <!-- Active Session / Account Switch Banner -->
          <div
            class="w-full bg-surface-container-low rounded-xl p-space-sm flex items-center justify-between shadow-md"
            id="session-banner"
          >
            <div class="flex items-center gap-space-sm min-w-0">
              <div class="relative flex-shrink-0">
                <div
                  class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-primary-fixed font-headline-sm text-headline-sm"
                >
                  CE
                </div>
                <span
                  class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-secondary-fixed ring-2 ring-surface-container-low"
                ></span>
              </div>
              <div class="flex flex-col min-w-0">
                <span
                  class="font-headline-sm text-headline-sm text-on-surface truncate"
                  >Carlos Eduardo</span
                >
                <span
                  class="font-body-sm text-body-sm text-on-surface-variant truncate"
                  >carlos.oliveira@fitadmin.com.br</span
                >
              </div>
            </div>
            <button
              class="flex-shrink-0 ml-space-sm px-space-sm py-1.5 rounded-lg bg-surface-container hover:bg-error-container/20 text-on-surface-variant hover:text-error transition-colors flex items-center gap-1 group"
              id="btn-logout"
              title="Desconectar sessão ativa"
              type="button"
            >
              <span
                class="material-symbols-outlined text-[18px] group-hover:text-error transition-colors"
                >logout</span
              >
              <span class="font-label-md text-label-md hidden sm:inline"
                >Logout</span
              >
            </button>
          </div>
          <!-- Main Card -->
          <div
            class="w-full bg-surface-container rounded-xl shadow-xl p-space-xl flex flex-col"
          >
            <!-- Card Header -->
            <div class="flex flex-col items-center text-center mb-space-lg">
              <div
                class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center text-primary-fixed mb-space-md shadow-inner"
              >
                <span class="material-symbols-outlined text-[26px]"
                  >admin_panel_settings</span
                >
              </div>
              <h1
                class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs"
              >
                Login do Administrador
              </h1>
              <p
                class="font-body-md text-body-md text-on-surface-variant max-w-[340px]"
              >
                Insira suas credenciais corporativas para acessar o painel de
                gestão.
              </p>
            </div>
            <!-- Login Form -->
            <form
              class="flex flex-col gap-space-lg"
              id="admin-login-form"
              onsubmit="event.preventDefault()"
            >
              <!-- Email Field -->
              <div class="flex flex-col gap-space-xs">
                <label
                  class="font-label-md text-label-md text-on-surface uppercase tracking-wider flex items-center justify-between"
                  for="admin-email"
                >
                  <span
                    >E-mail Corporativo
                    <span class="text-primary-fixed">*</span></span
                  >
                  <span
                    class="font-body-sm text-body-sm text-on-surface-variant lowercase"
                    >admin / gestor</span
                  >
                </label>
                <div class="relative flex items-center">
                  <span
                    class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none"
                    >mail</span
                  >
                  <input
                    class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/50 pl-11 pr-4 rounded-lg font-body-md text-body-md focus:outline-none focus:bg-surface-container-highest transition-colors"
                    id="admin-email"
                    name="email"
                    placeholder="exemplo@fitadmin.com.br"
                    required=""
                    type="email"
                    value="carlos.oliveira@fitadmin.com.br"
                  />
                </div>
              </div>
              <!-- Password Field -->
              <div class="flex flex-col gap-space-xs">
                <div class="flex items-center justify-between">
                  <label
                    class="font-label-md text-label-md text-on-surface uppercase tracking-wider"
                    for="admin-password"
                  >
                    Senha <span class="text-primary-fixed">*</span>
                  </label>
                  <a
                    class="font-label-md text-label-md text-primary-fixed hover:text-primary-fixed-dim transition-colors flex items-center gap-0.5"
                    href="#recuperar"
                  >
                    Esqueceu a senha?
                  </a>
                </div>
                <div class="relative flex items-center">
                  <span
                    class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none"
                    >lock</span
                  >
                  <input
                    class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/50 pl-11 pr-12 rounded-lg font-body-md text-body-md focus:outline-none focus:bg-surface-container-highest transition-colors"
                    id="admin-password"
                    name="password"
                    placeholder="••••••••••••"
                    required=""
                    type="password"
                  />
                  <button
                    aria-label="Alternar visibilidade da senha"
                    class="absolute right-3.5 text-on-surface-variant hover:text-on-surface p-1 transition-colors flex items-center justify-center"
                    id="toggle-password"
                    type="button"
                  >
                    <span
                      class="material-symbols-outlined text-[20px]"
                      id="toggle-password-icon"
                      >visibility</span
                    >
                  </button>
                </div>
              </div>
              <!-- Keep Connected Checkbox -->
              <div class="flex items-center gap-space-sm pt-space-xs">
                <label
                  class="relative flex items-center gap-space-sm cursor-pointer select-none"
                >
                  <input
                    checked=""
                    class="sr-only peer"
                    id="remember-device"
                    type="checkbox"
                  />
                  <div
                    class="w-5 h-5 rounded bg-surface-container-low peer-checked:bg-primary-fixed flex items-center justify-center transition-colors"
                  >
                    <span
                      class="material-symbols-outlined text-surface text-[16px] font-bold opacity-0 peer-checked:opacity-100 transition-opacity"
                      >check</span
                    >
                  </div>
                  <span
                    class="font-body-sm text-body-sm text-on-surface-variant"
                    >Manter sessão ativa neste dispositivo</span
                  >
                </label>
              </div>
              <!-- Primary CTA Button -->
              <button
                class="w-full h-[52px] bg-primary-fixed hover:bg-primary-fixed-dim text-surface font-headline-sm text-headline-sm tracking-wide rounded-lg flex items-center justify-center gap-space-sm shadow-md active:scale-[0.99] transition-all mt-space-xs"
                id="btn-submit"
                type="submit"
              >
                <span>ENTRAR NO SISTEMA</span>
                <span class="material-symbols-outlined text-[22px]"
                  >arrow_forward</span
                >
              </button>
            </form>
            <!-- Footer Quick Action / Register Switch -->
            <div
              class="flex flex-col items-center gap-space-sm pt-space-xl mt-space-lg"
            >
              <div class="w-full h-px bg-surface-container-highest"></div>
              <div
                class="flex items-center justify-center gap-1 font-body-sm text-body-sm text-on-surface-variant pt-space-xs"
              >
                <span>Não tem uma conta corporativa?</span>
                <a
                  class="font-headline-sm text-headline-sm text-primary-fixed hover:text-primary-fixed-dim transition-colors ml-1 inline-flex items-center gap-0.5"
                  href="#cadastro"
                >
                  Fazer Cadastro
                </a>
              </div>
            </div>
          </div>
          <!-- Security Metadata & Direct Logout Option -->
          <div
            class="flex items-center justify-between px-space-xs text-on-surface-variant font-label-sm text-label-sm tracking-widest uppercase"
          >
            <div class="flex items-center gap-1.5 opacity-75">
              <span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed"></span>
              <span>Conexão Segura TLS 256-Bit</span>
            </div>
            <button
              class="opacity-75 hover:opacity-100 hover:text-error transition-all flex items-center gap-1"
              id="btn-full-logout"
              type="button"
            >
              <span class="material-symbols-outlined text-[14px]"
                >power_settings_new</span
              >
              <span>Sair da Conta</span>
            </button>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const passwordInput = document.getElementById("admin-password");
          const toggleBtn = document.getElementById("toggle-password");
          const toggleIcon = document.getElementById("toggle-password-icon");
          const sessionBanner = document.getElementById("session-banner");
          const emailInput = document.getElementById("admin-email");
          const btnLogout = document.getElementById("btn-logout");
          const btnFullLogout = document.getElementById("btn-full-logout");

          if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener("click", function () {
              const isPassword =
                passwordInput.getAttribute("type") === "password";
              passwordInput.setAttribute(
                "type",
                isPassword ? "text" : "password"
              );
              toggleIcon.textContent = isPassword
                ? "visibility_off"
                : "visibility";
            });
          }

          function handleLogoutAction() {
            if (sessionBanner) {
              sessionBanner.style.opacity = "0";
              sessionBanner.style.transform = "translateY(-6px)";
              sessionBanner.style.transition = "all 0.25s ease-out";
              setTimeout(function () {
                sessionBanner.remove();
              }, 260);
            }
            if (emailInput) {
              emailInput.value = "";
              emailInput.placeholder = "exemplo@fitadmin.com.br";
              emailInput.focus();
            }
            if (passwordInput) {
              passwordInput.value = "";
            }
          }

          if (btnLogout) {
            btnLogout.addEventListener("click", handleLogoutAction);
          }

          if (btnFullLogout) {
            btnFullLogout.addEventListener("click", handleLogoutAction);
          }
        })();
      </script>
    </main>
  </body>
</html>
