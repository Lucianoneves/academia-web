<!doctype html>
<html class="dark" lang="en" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="web_blank" name="shell-type" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#002113",
              "on-secondary-fixed-variant": "#005236",
              "on-surface-variant": "#c4c9ac",
              outline: "#8e9379",
              "surface-tint": "#abd600",
              background: "#10141a",
              "surface-container-low": "#181c22",
              "surface-container-lowest": "#0a0e14",
              "surface-dim": "#10141a",
              "on-tertiary": "#472a00",
              primary: "#ffffff",
              "surface-bright": "#353940",
              "on-secondary": "#003824",
              "on-tertiary-fixed-variant": "#653e00",
              "primary-fixed": "#c3f400",
              "on-surface": "#dfe2eb",
              tertiary: "#ffffff",
              "on-error-container": "#ffdad6",
              "primary-fixed-dim": "#abd600",
              "secondary-fixed-dim": "#4edea3",
              "on-primary-fixed-variant": "#3c4d00",
              "outline-variant": "#444933",
              "on-primary-container": "#556d00",
              "on-background": "#dfe2eb",
              surface: "#10141a",
              "on-tertiary-container": "#8d5900",
              "on-primary-fixed": "#161e00",
              "error-container": "#93000a",
              error: "#ffb4ab",
              "on-error": "#690005",
              "tertiary-fixed-dim": "#ffb95f",
              "inverse-on-surface": "#2d3137",
              "on-primary": "#283500",
              "tertiary-fixed": "#ffddb8",
              "surface-container-highest": "#31353c",
              "inverse-surface": "#dfe2eb",
              "tertiary-container": "#ffddb8",
              "surface-container-high": "#262a31",
              "secondary-fixed": "#6ffbbe",
              "surface-container": "#1c2026",
              secondary: "#4edea3",
              "primary-container": "#c3f400",
              "surface-variant": "#31353c",
              "secondary-container": "#00a572",
              "on-tertiary-fixed": "#2a1700",
              "inverse-primary": "#506600",
              "on-secondary-container": "#00311f",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "space-md": "0.75rem",
              "space-xs": "0.25rem",
              "space-xl": "2rem",
              margin: "1rem",
              gutter: "1rem",
              "space-lg": "1.25rem",
              "space-sm": "0.5rem",
            },
            fontFamily: {
              "label-sm": ["Space Grotesk"],
              "headline-lg": ["Space Grotesk"],
              "label-md": ["Space Grotesk"],
              "headline-md": ["Space Grotesk"],
              "body-lg": ["Plus Jakarta Sans"],
              "data-display": ["Space Grotesk"],
              "headline-lg-mobile": ["Space Grotesk"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-xl": ["Space Grotesk"],
              "body-sm": ["Plus Jakarta Sans"],
              "label-lg": ["Space Grotesk"],
              "headline-xl-mobile": ["Space Grotesk"],
              "headline-sm": ["Space Grotesk"],
            },
            fontSize: {
              "label-sm": ["10px", { lineHeight: "12px", fontWeight: "700" }],
              "headline-lg": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "headline-md": [
                "20px",
                { lineHeight: "26px", fontWeight: "600" },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "data-display": [
                "32px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "headline-lg-mobile": [
                "22px",
                { lineHeight: "28px", fontWeight: "700" },
              ],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-xl": [
                "36px",
                { lineHeight: "44px", fontWeight: "700" },
              ],
              "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "label-lg": ["14px", { lineHeight: "18px", fontWeight: "600" }],
              "headline-xl-mobile": [
                "28px",
                { lineHeight: "34px", fontWeight: "700" },
              ],
              "headline-sm": [
                "16px",
                { lineHeight: "22px", fontWeight: "600" },
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-background font-body-md text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container"
  >
    <header
      class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
    >
      <div class="h-16 w-full px-space-xl flex items-center justify-between">
        <div class="flex items-center gap-space-sm">
          <div class="w-3 h-3 rounded-full bg-primary-container"></div>
          <span
            class="font-headline-sm text-headline-sm uppercase tracking-wider text-primary"
            >APEX<span class="text-primary-container">.FIT</span></span
          ><span class="mx-space-xs text-outline font-label-md">/</span
          ><span
            class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider"
            >ADMIN CONSOLE</span
          >
        </div>
        <div class="flex items-center gap-space-sm">
          <span
            class="material-symbols-outlined text-primary-container text-[18px]"
            >verified</span
          ><span
            class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest"
            >UNIT SELECTOR: JARDINS HQ</span
          >
        </div>
      </div>
    </header>
    <main class="w-full pt-16 bg-surface min-h-screen">
      <div class="flex flex-col w-full">
        <div
          class="relative w-full overflow-hidden px-space-xl py-space-xl min-h-[calc(100vh-4rem)] flex items-center justify-center"
        >
          <div
            class="absolute -top-32 -left-20 w-96 h-96 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"
          ></div>
          <div
            class="absolute top-1/2 -right-32 w-80 h-80 rounded-full bg-secondary-container/10 blur-3xl pointer-events-none"
          ></div>
          <div
            class="max-w-3xl mx-auto w-full flex flex-col items-center justify-center"
          >
            <div class="w-full flex flex-col gap-space-lg">
              <div
                class="bg-surface-container-low rounded-xl p-space-xl shadow-2xl relative"
              >
                <div
                  class="flex flex-col sm:flex-row sm:items-center justify-between pb-space-lg gap-space-sm"
                >
                  <div class="flex flex-col text-left">
                    <h1
                      class="font-headline-xl text-headline-xl text-primary tracking-tight"
                    >
                      Cadastro do Administrador
                    </h1>
                    <p
                      class="font-body-md text-body-md text-on-surface-variant mt-1"
                    >
                      Preencha os dados abaixo para criar sua conta de
                      administrador.
                    </p>
                  </div>
                </div>
                <form
                  class="flex flex-col gap-space-lg"
                  id="admin-reg-form"
                  onsubmit="event.preventDefault()"
                >
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
                    <div class="flex flex-col gap-2">
                      <label
                        class="font-label-md text-label-md text-on-surface flex items-center"
                        for="admin-name"
                        >Nome Completo<span class="text-error ml-1"
                          >*</span
                        ></label
                      >
                      <div class="relative flex items-center">
                        <span
                          class="material-symbols-outlined text-outline absolute left-3 pointer-events-none text-xl"
                          >badge</span
                        ><input
                          class="w-full bg-surface-container pl-10 pr-4 py-3 rounded-lg text-primary placeholder-outline font-body-md text-body-md focus:bg-surface-container-high focus:outline-none focus:text-primary transition-colors shadow-inner"
                          id="admin-name"
                          placeholder="Nome completo"
                          required=""
                          type="text"
                          value="Carlos Eduardo de Oliveira"
                        />
                      </div>
                    </div>
                    <div class="flex flex-col gap-2">
                      <label
                        class="font-label-md text-label-md text-on-surface flex items-center"
                        for="admin-email"
                        >E-mail Corporativo<span class="text-error ml-1"
                          >*</span
                        ></label
                      >
                      <div class="relative flex items-center">
                        <span
                          class="material-symbols-outlined text-outline absolute left-3 pointer-events-none text-xl"
                          >mail</span
                        ><input
                          class="w-full bg-surface-container pl-10 pr-4 py-3 rounded-lg text-primary placeholder-outline font-body-md text-body-md focus:bg-surface-container-high focus:outline-none transition-colors shadow-inner"
                          id="admin-email"
                          placeholder="email@empresa.com"
                          required=""
                          type="email"
                          value="carlos.oliveira@fitadmin.com.br"
                        />
                      </div>
                    </div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
                    <div class="flex flex-col gap-2">
                      <label
                        class="font-label-md text-label-md text-on-surface flex items-center"
                        for="admin-password"
                        >Senha<span class="text-error ml-1">*</span></label
                      >
                      <div class="relative flex items-center">
                        <span
                          class="material-symbols-outlined text-outline absolute left-3 pointer-events-none text-xl"
                          >key</span
                        ><input
                          class="w-full bg-surface-container pl-10 pr-10 py-3 rounded-lg text-primary placeholder-outline font-body-md text-body-md focus:bg-surface-container-high focus:outline-none transition-colors shadow-inner"
                          id="admin-password"
                          placeholder="Sua senha"
                          required=""
                          type="password"
                          value="ApexCorp#2025!"
                        /><button
                          aria-label="Alternar visibilidade da senha"
                          class="absolute right-3 text-outline hover:text-primary transition-colors flex items-center"
                          onclick="
                            togglePasswordVisibility('admin-password', this)
                          "
                          type="button"
                        >
                          <span class="material-symbols-outlined text-xl"
                            >visibility</span
                          >
                        </button>
                      </div>
                    </div>
                    <div class="flex flex-col gap-2">
                      <label
                        class="font-label-md text-label-md text-on-surface flex items-center"
                        for="admin-confirm-password"
                        >Confirmação de Senha<span class="text-error ml-1"
                          >*</span
                        ></label
                      >
                      <div class="relative flex items-center">
                        <span
                          class="material-symbols-outlined text-outline absolute left-3 pointer-events-none text-xl"
                          >lock_reset</span
                        ><input
                          class="w-full bg-surface-container pl-10 pr-10 py-3 rounded-lg text-primary placeholder-outline font-body-md text-body-md focus:bg-surface-container-high focus:outline-none transition-colors shadow-inner"
                          id="admin-confirm-password"
                          placeholder="Confirme sua senha"
                          required=""
                          type="password"
                          value="ApexCorp#2025!"
                        /><button
                          aria-label="Alternar visibilidade da confirmação de senha"
                          class="absolute right-3 text-outline hover:text-primary transition-colors flex items-center"
                          onclick="
                            togglePasswordVisibility(
                              'admin-confirm-password',
                              this
                            )
                          "
                          type="button"
                        >
                          <span class="material-symbols-outlined text-xl"
                            >visibility</span
                          >
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="flex flex-col gap-space-md pt-space-xs">
                    <button
                      class="w-full h-14 bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim rounded-xl font-headline-sm text-headline-sm uppercase tracking-wider flex items-center justify-center gap-3 shadow-lg hover:shadow-primary-container/20 transition-all active:scale-[0.98]"
                      type="submit"
                    >
                      <span class="">Cadastrar Administrador</span
                      ><span
                        class="material-symbols-outlined text-2xl font-bold"
                        >arrow_forward</span
                      >
                    </button>
                    <div
                      class="flex items-center justify-center gap-1 font-body-sm text-body-sm text-on-surface-variant"
                    >
                      <span class="">Já tem uma conta?</span
                      ><a
                        class="text-primary-fixed hover:underline font-label-md text-label-md"
                        href="#"
                        >Fazer Login</a
                      >
                    </div>
                  </div>
                </form>
                <div
                  class="mt-space-lg pt-space-md flex flex-col md:flex-row items-center justify-between gap-space-sm text-outline font-label-sm text-label-sm"
                >
                  <div class="flex items-center gap-space-sm flex-wrap">
                    <span class="text-outline-variant">•</span>
                  </div>
                  <div class="flex items-center gap-space-md">
                    <a
                      class="hover:text-primary transition-colors flex items-center gap-1"
                      href="#"
                      ><span class="material-symbols-outlined text-base"
                        >support_agent</span
                      >Suporte de TI / Helpdesk</a
                    ><span class="text-outline-variant">•</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        function togglePasswordVisibility(inputId, btn) {
          const input = document.getElementById(inputId);
          const icon = btn.querySelector(".material-symbols-outlined");
          if (input.type === "password") {
            input.type = "text";
            icon.textContent = "visibility_off";
          } else {
            input.type = "password";
            icon.textContent = "visibility";
          }
        }
      </script>
    </main>
  </body>
</html>
